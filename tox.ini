[tox]
requires =
    tox>=4.25
    tox-uv>=1.16
env_list =
    py311
    py312
    py313
    py314
    py315
    lint
    type
    security
    build
skip_missing_interpreters = false

[testenv]
runner = uv-venv-runner
package = wheel
extras = test
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    COVERAGE_FILE = {env_tmp_dir}/.coverage
commands =
    python -m pytest -q --cov=async_orm_kit --cov-branch --cov-fail-under=0 {posargs:tests}

[testenv:lint]
skip_install = true
deps = ruff>=0.17.3,<0.18
commands =
    ruff check src tests .github/scripts
    ruff format --check src tests .github/scripts

[testenv:type]
skip_install = true
deps =
    mypy>=1.15,<3
    sqlalchemy>=2.0.40,<3
commands =
    mypy src/async_orm_kit

[testenv:security]
skip_install = true
deps = bandit[toml]>=1.8,<2
commands = bandit -c pyproject.toml -r src/async_orm_kit

[testenv:build]
package = wheel
extras = test
deps =
    twine>=6,<8
    uv>=0.13.6,<0.14
commands =
    uv build --no-sources --python {env_python} --out-dir {env_tmp_dir}/dist
    python -m twine check --strict {env_tmp_dir}/dist/*
    python .github/scripts/validate_distribution.py {env_tmp_dir}/dist --test-sdist

[testenv:coverage]
extras =
    test
    postgres
    mysql
pass_env =
    ASYNC_ORM_KIT_POSTGRES_URL
    ASYNC_ORM_KIT_MYSQL_URL
commands =
    python -m pytest -q --cov=async_orm_kit --cov-branch --cov-fail-under=100 --junitxml={env_tmp_dir}/complete-results.xml {posargs:tests}
    python .github/scripts/check_pytest_junit.py {env_tmp_dir}/complete-results.xml --min-tests 600
